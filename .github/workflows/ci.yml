name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests & validation regression guard
        run: npm test
      - name: Re-run validation (must reproduce committed numbers)
        run: |
          node tools/evaluate.mjs
          git diff --stat -- data/validation.json data/discoveries.json
